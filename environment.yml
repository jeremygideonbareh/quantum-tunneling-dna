# conda env create -f environment.yml && conda activate qtdna && pip install -e ".[dev]"
name: qtdna
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - ase>=3.23
  - tblite-python      # GFN2-xTB as an ASE calculator
  - xtb                # xtb CLI: ALPB/GBSA implicit solvent, --scan, --hess
  - rdkit
  - pyfaidx            # random access to the human genome
  - pysam
  - pytest
  - pip
  - pip:
      - pyscf>=2.6          # DFT checks (replaces ORCA; no registration)
      - pyscf-dispersion    # D3(BJ)
# B-DNA building uses PyMOL fnab in a separate env (its wheel needs numpy<2):
#   python -m venv .pymolenv && .pymolenv/bin/pip install pymol-open-source-whl "numpy<2"
